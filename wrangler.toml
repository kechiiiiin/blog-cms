name = "blog-cms"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Secrets（GITHUB_TOKEN など）は wrangler secret / Pages の環境変数で設定する。
# ローカル開発では .dev.vars に書く（.gitignore 済み）。

# R2: images.kechiiiiin.com の実バケット（画像アップロード先）
# ※ pages_build_output_dir がある構成では、バインディングは wrangler.toml が正
#   （デプロイ時に自動反映。ダッシュボードの「追加」は無効化されるのが正常）。
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "images"

# KV: 一覧メタのキャッシュ（真実は GitHub。壊れたらキー削除で再構築される）
# ※ 上記と同じく wrangler.toml が正。デプロイ時に自動でバインドされる。
[[kv_namespaces]]
binding = "CMS_CACHE"
id = "bed190d381d846f0b24e7669fd04b172"

# 関所（sekisho・Cloudflare Access の JWT を検証する認証 Worker）。src/lib/auth/sekisho.ts が RPC で verify を呼ぶ。
# Pages でも Workers と同じ書き方（https://developers.cloudflare.com/pages/functions/wrangler-configuration/#service-bindings）。
# トップレベルに書いたバインディングは production / preview の両方に効く。[env.production] / [env.preview] を
# 足すと services・r2_buckets・kv_namespaces などの非継承キーを全部書き直す必要があるので、分けない。
# チームドメインと許可メールは関所の側で持つ（ここの secret は CF_ACCESS_AUD だけ）。
[[services]]
binding = "SEKISHO"
service = "sekisho"
